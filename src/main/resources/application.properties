spring.application.name=newssite

# --- Database (UPDATED FOR RENDER) ---
# We use ${VAR_NAME} so Spring reads these from Render's dashboard
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- File Uploads (SEE WARNING BELOW) ---
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# ALLOW CROSS-SITE COOKIES (Required for Vercel -> Render)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
# Force the correct backend URL for image generation
app.backend.url=https://newssite-i504.onrender.com
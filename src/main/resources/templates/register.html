<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Subscribe - The Gilded Press</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --color-black: #000000;
      --color-gold: #D4AF37;
      --color-gold-dark: #b5952f;
      --color-white: #ffffff;
      --color-gray: #f4f4f4;
      --font-serif: 'Georgia', 'Times New Roman', serif;
      --font-sans: 'Arial', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      background-color: var(--color-gray);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* --- BRANDED HEADER --- */
    .auth-header {
      background-color: var(--color-black);
      width: 100%;
      padding: 25px 0;
      text-align: center;
      margin-bottom: 50px;
      border-bottom: 4px solid var(--color-gold);
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--color-white);
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
    }

    .gold-text {
      color: var(--color-gold);
    }

    /* --- REGISTER CARD --- */
    .auth-container {
      background: var(--color-white);
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-top: 5px solid var(--color-black);
      margin-bottom: 50px;
    }

    h2 {
      font-family: var(--font-serif);
      text-align: center;
      font-size: 2rem;
      margin: 0 0 10px 0;
      color: var(--color-black);
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 0.95rem;
      font-style: italic;
      font-family: var(--font-serif);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ddd;
      box-sizing: border-box;
      transition: all 0.3s;
      background: #fafafa;
    }

    input:focus {
      outline: none;
      border-color: var(--color-gold);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    /* --- GOLD BUTTON --- */
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--color-gold);
      color: var(--color-black);
      border: 1px solid var(--color-gold);
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--color-black);
      color: var(--color-gold);
      border-color: var(--color-black);
    }

    /* --- MESSAGES --- */
    .message {
      text-align: center;
      margin-bottom: 20px;
      padding: 12px;
      font-size: 0.9rem;
      border-radius: 4px;
    }

    .error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .switch-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #666;
      text-decoration: none;
      font-size: 0.9rem;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .switch-link a {
      color: var(--color-black);
      font-weight: bold;
      text-decoration: none;
      border-bottom: 2px solid var(--color-gold);
      padding-bottom: 1px;
      transition: color 0.3s;
    }

    .switch-link a:hover {
      color: var(--color-gold-dark);
    }
  </style>
</head>
<body>

<div class="auth-header">
  <a href="/" class="logo">
    THE <span class="gold-text">GILDED</span> PRESS
  </a>
</div>

<div class="auth-container">
  <h2>Subscribe</h2>
  <p class="subtitle">Join our exclusive readership.</p>

  <div th:if="${error}" class="message error">
    <span th:text="${error}">Error message</span>
  </div>

  <div th:if="${success}" class="message success">
    <span th:text="${success}">Success message</span>
  </div>

  <form method="post" th:action="@{/register}">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Samet Karakaya" required>
    </div>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" name="email" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Create a strong password" required>
    </div>

    <button type="submit">Create Account</button>
  </form>

  <p class="switch-link">
    Already have an account? <a th:href="@{/login}">Sign In</a>
  </p>
</div>

</body>
</html>
